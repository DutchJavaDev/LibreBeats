name: liberated_beats
description: An open source music player — Liberated Beats.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.2.3
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
