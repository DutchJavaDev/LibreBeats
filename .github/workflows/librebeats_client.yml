name: LibreBeats Client
on:
  pull_request:
    branches: ["*"]
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "src/frontend/**"
      - ".github/workflows/librebeats_client.yml"
      - "!src/frontend/**/*.md"
      - "!src/frontend/**/.gitignore"
      - "!src/frontend/**/*.metadata"
      - "!src/frontend/env.json.example"
  workflow_call:

permissions:
  contents: read
env:
  WORKING_DIR: src/frontend
  # Same pin as frontend_release.yml, so tests and release builds use one Flutter version.
  FLUTTER_VERSION: "3.44.4"
jobs:
  flutter_tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
        
      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Verify formatting
        working-directory: ${{ env.WORKING_DIR }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter analyze

      - name: Run tests + coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: ${{ env.WORKING_DIR }}/coverage/lcov.info
